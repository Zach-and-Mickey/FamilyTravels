<!DOCTYPE html>
<html>
<head>
    <title>Sound Test</title>
</head>
<style>
    
    body{
        display:flex;
        flex-direction: column;
        justify-content: center;
        text-align:center;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
            color: #e0e0e0;
        }

        /* Main Zen-like background */
        .zen-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(120, 80, 220, 0.705) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(80, 199, 220, 0.868) 0%, transparent 60%),
                linear-gradient(135deg, #3434b7c4 0%, #4b78ff96 50%, #25c2deaf 100%);
            background-size: cover;
            z-index: 1;
        }

        /* Subtle animated noise / grain overlay */
        .zen-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.6;
            animation: subtleShift 25s linear infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes subtleShift {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        /* Soft glow orb */
        .zen-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(96, 40, 237, 0.622) 10%, transparent 70%);
            border-radius: 50%;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -30%);
            filter: blur(80px);
            z-index: 1;
            animation: slowPulse 30s ease-in-out infinite alternate;
        }

        @keyframes slowPulse {
            from { opacity: 0.7; transform: translate(-50%, -30%) scale(0.95); }
            to { opacity: 0.95; transform: translate(-50%, -25%) scale(1.05); }
        }
        .app {
            z-index:1000;
        }
    #keyboard {
        display: flex;
        flex-direction: row;
        justify-content: center;
        margin:0;
        width: 100%;
    }
    .white-key {
        width: 50px;
        height: 200px;
        border: 1px solid black;
        margin: 0 2px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
    }c
    #control-knobs{
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 20px;
    }
    .active-key{
        background-color: gray;
    }
    canvas{
        background: rgba(0, 0, 0, 0.492);
        border-radius: 25px;
    }
</style>
<body>
<div class="zen-bg"></div>
        <div class="zen-glow"></div>
            <div class = 'app'>
<h1>Synthesizer</h1>
<div id="keyboard">
<button class="white-key" data-key="q" onclick="playC3()">C3</button>
<button class="white-key" data-key="w" onclick="playD3()">D3</button>
<button class="white-key" data-key="e" onclick="playE3()">E3</button>
<button class="white-key" data-key="r" onclick="playF3()">F3</button>
<button class="white-key" data-key="t" onclick="playG3()">G3</button>
<button class="white-key" data-key="y" onclick="playA3()">A3</button>
<button class="white-key" data-key="u" onclick="playB3()">B3</button>
<button class="white-key" data-key="i" onclick="playC4()">C4</button>
<button class="white-key" data-key="a" onclick="playD4()">D4</button>
<button class="white-key" data-key="s" onclick="playE4()">E4</button>
<button class="white-key" data-key="d" onclick="playF4()">F4</button>
<button class="white-key" data-key="f" onclick="playG4()">G4</button>
<button class="white-key" data-key="g" onclick="playA4()">A4</button>
<button class="white-key" data-key="h" onclick="playB4()">B4</button>
<button class="white-key" data-key="j" onclick="playC5()">C5</button>
</div>
<div id="control-knobs">
    <div id="selection">
    <label for="waveType">Waveform:</label>
    <select name = "waveType" id="waveType" style="width: 50%">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="triangle">Triangle</option>
        <option value="sawtooth">Sawtooth</option>
    </select>
    </div>
<label>
    Gain:
<input id='gain' type="range" min="0" max="2" step=".05">
<span id='gainValue'>0</span>
</label>
<label>
    Attack:
<input id='attack' type="range" min="0" max=".2" step=".001">
<span id='attackValue'>0</span>
</label>
<label>
    Decay:
<input id='decay' type="range" min="0" max="4" step=".005">
<span id="decayValue">0</span>
</label>
<label>
    Sustain:
<input id='sustain' type="range" min="0" max="4" step=".005">
<span id="sustainValue">0</span>
</label>
<label>
    Release:
<input id='release' type="range" min="0" max="4" step=".005">
<span id="releaseValue">0</span>
</label>
</div>
<div id="otherFeatures">
<label>
Filter
<input id="cutoff" type="range" min="200" max="8000" value="2500">
<span id="cutoffValue">0</span>
</label>
<label>
Resonance
<input id="resonance" type="range" min="0" max="10" value=".5" step=".1">
<span id="resonanceValue">0</span>
</label>
</div>
<canvas id="waveform" width="800" height="200"></canvas>
</div>
<script>
const audio = new AudioContext();
const notes = {
    q: 261.63/2, // C3
    w: 293.66/2, // D3
    e: 329.63/2, // E3
    r: 349.23/2, // F3
    t: 392.00/2, // G3
    y: 440.00/2, // A3
    u: 493.88/2, // B3
    i: 523.25/2,  // C4
    a: 293.66, // D4
    s: 329.63, // E4
    d: 349.23, // F4
    f: 392.00, // G4
    g: 440.00, // A4
    h: 493.88, // B4
    j: 523.25  // C5
};
const activeNotes = {};
const analyser = audio.createAnalyser();

analyser.fftSize = 1024;

function startNote(freq) {
    const waveType = document.getElementById("waveType").value;
    const attack = Number(document.getElementById("attack").value);
    const decay = Number(document.getElementById("decay").value);
    const sustain = Number(document.getElementById("sustain").value);
    const release = Number(document.getElementById("release").value);
    const masterGainValue = Number(document.getElementById("gain").value);
    const cutoffFreq = Number(document.getElementById("cutoff").value);
    const resonance = Number(document.getElementById("resonance").value);


    const osc1 = audio.createOscillator();
    const osc2 = audio.createOscillator();
    const gain1 = audio.createGain();
    const gain2 = audio.createGain();
    gain2.gain.value=1;
    const filter = audio.createBiquadFilter();
    filter.frequency.value = cutoffFreq;
    filter.Q.value = resonance; 


    const envelopeGain = audio.createGain();
    envelopeGain.gain.value = masterGainValue;

    const delay = audio.createDelay();
    delay.delayTime.value = .3;
gain1.gain.value = 1;
gain2.gain.value= 0;
    osc1.connect(gain1);
    osc2.connect(gain2);
    gain1.connect(envelopeGain);
    gain2.connect(envelopeGain);
    envelopeGain.connect(filter);
    filter.connect(analyser);
    analyser.connect(audio.destination);


    osc1.frequency.value = freq;
    osc2.frequency.value = freq;
    osc1.type = waveType;
    osc2.type = "sawtooth";
//INITIAL
   envelopeGain.gain.setValueAtTime(
    0,
    audio.currentTime
);
//ATTACK
envelopeGain.gain.linearRampToValueAtTime(
    1,
    audio.currentTime + attack
);
//DECAY
envelopeGain.gain.linearRampToValueAtTime(
    0.3,
    audio.currentTime + attack + decay
);
//SUSTAIN
envelopeGain.gain.linearRampToValueAtTime(
    0.3,
    audio.currentTime + attack + decay + sustain
);
//RELEASE
envelopeGain.gain.exponentialRampToValueAtTime(
    .0001,
    audio.currentTime + attack + decay + sustain + release
);
envelopeGain.gain.linearRampToValueAtTime(
    0,
    audio.currentTime + attack + decay + sustain + release + .001
);
    osc1.start();
    osc2.start();
return {
    osc1,
    osc2,
    envelopeGain,
    gain1,
    gain2
}
}
function stopNote(note){

    const release =
        Number(document.getElementById("release").value);

    const now = audio.currentTime;

    note.envelopeGain.gain.cancelScheduledValues(now);

    note.envelopeGain.gain.setValueAtTime(
        note.envelopeGain.gain.value,
        now
    );

    note.envelopeGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + release
    );

    note.osc1.stop(now + release);
    note.osc2.stop(now + release);

}
function playC3() {
    startNote(261.63/2)
}
function playD3() {
    startNote(293.66/2)
}
function playE3() {
    startNote(329.63/2)
}
function playF3() {
    startNote(349.23/2)
}
function playG3() {
    startNote(392/2)
}
function playA3() {
    startNote(220);
}
function playB3() {
    startNote(493.88/2);
}
function playC4() {
    startNote(261.63)
}
function playD4() {
    startNote(293.66)
}
function playE4() {
    startNote(329.63)
}
function playF4() {
    startNote(349.23)
}
function playG4() {
    startNote(392)
}
function playA4() {
    startNote(440);
}

function playB4() {
    startNote(493.88);
}

function playC5() {
    startNote(523.25);
}
const sliders = document.querySelectorAll("input[type='range']");

sliders.forEach(slider => {

    const valueLabel = document.getElementById(slider.id + "Value");

    valueLabel.textContent = slider.value;

    slider.addEventListener("input", () => {
        valueLabel.textContent = Number(slider.value).toFixed(3);
    });

});
document.addEventListener("keydown", (event) => {

    if (event.repeat) return;

    const freq = notes[event.key];

    if (!freq) return;

    activeNotes[event.key] = startNote(freq);

    const keyButton = document.querySelector(
        `[data-key="${event.key}"]`
    );

    if(keyButton){
        keyButton.classList.add("active-key");
    }
    console.log(event.key)
});
document.addEventListener("keyup", (event) => {

    const note = activeNotes[event.key];

    if (!note) return;

    stopNote(note);

    delete activeNotes[event.key];
        
    const keyButton = document.querySelector(
        `[data-key="${event.key}"]`
    );

    if(keyButton){
        keyButton.classList.remove("active-key");
    }

});

///////////// Canvas element for drawing wave  ///////////////////
const canvas = document.getElementById("waveform");
const ctx = canvas.getContext("2d");

const dataArray = new Uint8Array(analyser.fftSize);


function drawWaveform(){

    requestAnimationFrame(drawWaveform);

    analyser.getByteTimeDomainData(dataArray);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.beginPath();

    for(let i = 0; i < dataArray.length; i++){

        const x = i / dataArray.length * canvas.width;

        const y = dataArray[i] / 255 * canvas.height;

        if(i === 0){
            ctx.moveTo(x,y);
        }
        else{
            ctx.lineTo(x,y);
        }
    }
    ctx.strokeStyle = "rgb(255,100,100)";
    ctx.stroke();

}

drawWaveform();
</script>
</body>
</html>
